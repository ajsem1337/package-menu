name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install current fzf
        run: |
          curl --fail --location --output fzf.tar.gz https://github.com/junegunn/fzf/releases/download/v0.74.5/fzf-0.74.5-linux_amd64.tar.gz
          echo 'd47d7f882972c7d674dbbba998ffa4116e68379616ffac7695d0671e9a722c5f  fzf.tar.gz' | sha256sum -c -
          tar -xzf fzf.tar.gz fzf
          sudo install -m755 fzf /usr/local/bin/fzf
          rm fzf fzf.tar.gz
      - name: Tests (mocked network and transactions)
        run: make test
